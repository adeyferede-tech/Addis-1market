<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Shop</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><a class="brand" id="brand" href="#">Shop</a><nav><a href="#shop">Shop</a><a href="#visit">Find us</a></nav><button class="btn" id="openCart">Cart (<span id="cnt">0</span>)</button></header>
<section class="hero"><h1 id="hName"></h1><p id="hTag"></p><a class="btn" href="#shop">Shop now</a></section>
<section class="sec" id="shop"><h2>Our products</h2><div class="bar"><input id="q" placeholder="Search products"><div id="cats" style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div class="grid" id="grid"></div></section>
<section class="sec" id="visit" style="background:#f1efe7"><h2>Find us</h2><div class="visit"><div id="vinfo"></div><div id="vmap"></div></div></section>
<footer id="foot"></footer>
<div class="shade" id="shade"></div>
<aside class="panel" id="panel"><div class="ph"><h2 id="ptitle">Your cart</h2><button class="x" id="close">×</button></div><div class="pb" id="pb"></div><div class="pf" id="pf"></div></aside>
<script src="/app.js"></script></body></html>
