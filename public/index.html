<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Shop</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="ann hide" id="ann"></div>
<header class="top"><button class="burger" id="burger" aria-label="Menu">☰</button><a class="brand" id="brand" href="/">Shop</a>
<nav class="nav" id="nav"><button class="nl" data-c="All">Home</button><div class="dd"><button class="nl">Shop ▾</button><div class="ddm" id="ddm"></div></div><button class="nl" data-s="new">New Arrivals</button><a class="nl" href="#about">About us</a><a class="nl" href="#contact">Contact us</a></nav>
<button class="btn" id="openCart">Cart (<span id="cnt">0</span>)</button></header>
<section class="band"><h1 id="ctitle">All Products</h1><p id="hTag"></p></section>
<main class="coll" id="shop">
<div class="crumb"><span><a href="#" data-c="All">Home</a> / <b id="crumb">All Products</b></span><span id="pginfo"></span></div>
<div class="tool"><button class="btn o" id="ftog">Filter</button><input id="q" placeholder="Search products">
<label>Sort by <select id="sort"><option value="featured">Featured</option><option value="az">Alphabetically: A-Z</option><option value="za">Alphabetically: Z-A</option><option value="lh">Price: Low to High</option><option value="hl">Price: High to Low</option><option value="new">Date: New to Old</option><option value="old">Date: Old to New</option></select></label></div>
<div class="cl"><aside class="side" id="side"><h4>Collections</h4><div id="catlist"></div>
<h4>Availability</h4><label><input type="checkbox" id="av_in"> In stock (<span id="n_in">0</span>)</label><label><input type="checkbox" id="av_out"> Out of stock (<span id="n_out">0</span>)</label>
<h4>Price (ETB)</h4><div class="pr"><input id="pmin" type="number" min="0" placeholder="From"><input id="pmax" type="number" min="0" placeholder="To"></div><button class="btn s" id="pgo">Submit</button></aside>
<div><div class="pg" id="grid"></div><div class="pager" id="pager"></div></div></div></main>
<section class="sec" id="about" style="background:#f1efe7"><h2>About us</h2><p id="aboutT" style="max-width:70ch"></p></section>
<section class="sec" id="contact"><h2>Contact us</h2><div class="visit"><div id="vinfo"></div><div id="vmap"></div></div></section>
<footer class="foot"><div class="fgrid"><div><h4>Follow</h4><div class="soc" id="fsoc"></div></div><div><h4 id="fname">Shop</h4><p id="fabout"></p><p id="fcall"></p></div><div><h4>We accept</h4><div class="pay-b"><span>Telebirr</span><span>CBE Birr</span><span>Chapa</span><span>Cash on delivery</span></div></div></div><div class="copy" id="foot"></div></footer>
<div class="qvw" id="qv"><div class="qvc"><button class="x" data-qx="1">×</button><div class="qvg" id="qvb"></div></div></div>
<div class="shade" id="shade"></div>
<aside class="panel" id="panel"><div class="ph"><h2 id="ptitle">Your cart</h2><button class="x" id="close">×</button></div><div class="pb" id="pb"></div><div class="pf" id="pf"></div></aside>
<script src="/app.js"></script></body></html>
